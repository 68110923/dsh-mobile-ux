# dsh-mobile-ux bundle patch: inserts the client plugin row.
#
# `name` is the npm/git package name, which is what the loader resolves from the
# profile's node_modules. It matches package.json and the browser module id in
# client.js — all three must agree.
#
# `id` is only the loader's row identifier and is deliberately kept stable across
# the project's renames: profiles that installed an earlier version already carry
# this id, and changing it would leave the old row in place and load the plugin
# twice.
- insert:
    - id: mobile-keyboard-viewport
      name: 'dsh-mobile-ux'
